name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Export order CSV artifact
        run: |
          mkdir -p artifacts
          python -c "from pathlib import Path; from app.main import seed_if_empty, export_orders_csv; seed_if_empty(); export_orders_csv(Path('artifacts/orders.csv'))"

      - name: Upload sales export artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-export
          path: artifacts/orders.csv
