services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ALLOW_DEMO_CHECKOUT: "true"
      STORE_DB_PATH: /data/store.db
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_API_KEY: local-admin-key
    volumes:
      - storefront-data:/data

volumes:
  storefront-data:
